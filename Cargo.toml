# Cargo.toml

[package]
name = "nullidentd"
version = "1.1.0"
edition = "2024"
resolver = "2"


[dependencies]
clap = { version = "4.6", features = ["derive"] }
socket2 = "0.6"
tokio = { version = "1.54", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = "0.3"


[build-dependencies]
anyhow = "1.0"
build-data = "0.3"


[profile.release]
lto = "fat"
opt-level = 3
codegen-units = 1


[profile.minsize]
inherits = "release"
strip = true
lto = "fat"
opt-level = "s"
panic = "abort"

# EOF
